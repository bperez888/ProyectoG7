<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Horario</title>
</head>
<body>

    <!-- FORMULARIO (encabezado + modal) -->
    <section th:fragment="formulario">
        <div class="row py-4 mb-2 bg-light mx-0">
            <div class="col-md-6 px-4">
                <h3 class="mb-0" th:text="#{horario.titulo}"></h3>
            </div>
            <div class="col-md-6 px-4 text-md-end">
                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#horarioModal"
                        data-modo="agregar"
                        th:data-titulo="#{horario.agregar}">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span th:text="#{horario.agregar}"></span>
                </button>
            </div>
        </div>

        <div class="modal fade" id="horarioModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="horarioForm" method="post" th:action="@{/horario/guardar}">
                        <div class="modal-header" id="horarioModalHeader">
                            <h5 class="modal-title" id="horarioModalTitulo"></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="horarioId" name="idHorario"/>

                            <div class="mb-3">
                                <label for="horarioBarbero" class="form-label" th:text="#{horario.barbero}"></label>
                                <select id="horarioBarbero" name="barbero.idBarbero" class="form-select" required="required">
                                    <option th:each="b : ${barberos}" th:value="${b.idBarbero}" th:text="${b.nombre}"></option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="horarioDia" class="form-label" th:text="#{horario.dia}"></label>
                                <select id="horarioDia" name="diaSemana" class="form-select" required="required">
                                    <option value="1" th:text="#{dia.1}"></option>
                                    <option value="2" th:text="#{dia.2}"></option>
                                    <option value="3" th:text="#{dia.3}"></option>
                                    <option value="4" th:text="#{dia.4}"></option>
                                    <option value="5" th:text="#{dia.5}"></option>
                                    <option value="6" th:text="#{dia.6}"></option>
                                    <option value="7" th:text="#{dia.7}"></option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="horarioInicio" class="form-label" th:text="#{horario.inicio}"></label>
                                    <input type="time" id="horarioInicio" name="horaInicio" class="form-control" required="required"/>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="horarioFin" class="form-label" th:text="#{horario.fin}"></label>
                                    <input type="time" id="horarioFin" name="horaFin" class="form-control" required="required"/>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                                <span th:text="#{accion.cerrar}"></span>
                            </button>
                            <button type="submit" class="btn btn-success">
                                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                                <span th:text="#{accion.guardar}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- LISTADO -->
    <section th:fragment="listado" class="p-3">
        <div class="row p-3">
            <div class="col-md-9">
                <div class="card p-2">
                    <div class="card-body">
                        <div th:if="${horarios != null and !horarios.empty}" class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th th:text="#{horario.barbero}"></th>
                                        <th th:text="#{horario.dia}"></th>
                                        <th th:text="#{horario.inicio}"></th>
                                        <th th:text="#{horario.fin}"></th>
                                        <th><span class="visually-hidden" th:text="#{cita.acciones}"></span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="h : ${horarios}">
                                        <td th:text="${h.barbero?.nombre}"></td>
                                        <td><span th:replace="~{general/fragmentos :: nombreDia(${h.diaSemana})}"></span></td>
                                        <td th:text="${#temporals.format(h.horaInicio, 'HH:mm')}"></td>
                                        <td th:text="${#temporals.format(h.horaFin, 'HH:mm')}"></td>
                                        <td class="text-nowrap">
                                            <button type="button" class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                    th:data-bs-id="${h.idHorario}"
                                                    th:data-bs-descripcion="${h.barbero?.nombre}">
                                                <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                                <span th:text="#{accion.eliminar}"></span>
                                            </button>
                                            <button type="button" class="btn btn-warning btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#horarioModal"
                                                    data-modo="editar"
                                                    th:data-titulo="#{accion.actualizar}"
                                                    th:data-id="${h.idHorario}"
                                                    th:data-barbero="${h.barbero?.idBarbero}"
                                                    th:data-dia="${h.diaSemana}"
                                                    th:data-inicio="${#temporals.format(h.horaInicio, 'HH:mm')}"
                                                    th:data-fin="${#temporals.format(h.horaFin, 'HH:mm')}">
                                                <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                                                <span th:text="#{accion.actualizar}"></span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-center p-2" th:if="${horarios == null or horarios.empty}">
                            <span th:text="#{lista.vacia}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center bg-success text-white mb-3">
                    <div class="card-body">
                        <h3 th:text="#{horario.total}"></h3>
                        <h4 class="fs-2">
                            <i class="fas fa-calendar-days" aria-hidden="true"></i>
                            <span th:text="${totalHorarios}"></span>
                        </h4>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
