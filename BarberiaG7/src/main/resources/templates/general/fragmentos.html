<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Barbería</title>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/rutinas.js}"></script>
</head>

<body>

    <!-- SIDEBAR CLIENTE -->
    <aside th:fragment="sidebarCliente(opcion)" class="sidebar bg-dark d-flex flex-column align-items-center py-3 px-2">
        <a th:href="@{/cliente/servicios}" class="text-white text-decoration-none fw-bold fs-5 mb-4"
           th:text="#{aplicacion.titulo}"></a>
        <ul class="nav flex-column w-100">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'servicios'} ? 'active'" th:href="@{/cliente/servicios}">
                    <i class="fa-solid fa-comment-dots" aria-hidden="true"></i>
                    <span th:text="#{plantilla.servicios}"></span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'citas'} ? 'active'" th:href="@{/cliente/citas}">
                    <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
                    <span th:text="#{plantilla.misCitas}"></span></a>
            </li>
            <li class="nav-item mt-4">
                <a class="nav-link" th:href="@{/}">
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span th:text="#{plantilla.salir}"></span></a>
            </li>
        </ul>
    </aside>

    <!-- SIDEBAR ADMIN -->
    <aside th:fragment="sidebarAdmin(opcion)" class="sidebar bg-dark d-flex flex-column align-items-center py-3 px-2">
        <a th:href="@{/admin/dashboard}" class="text-white text-decoration-none fw-bold fs-5 mb-4"
           th:text="#{aplicacion.titulo}"></a>
        <ul class="nav flex-column w-100">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'dashboard'} ? 'active'" th:href="@{/admin/dashboard}">
                    <i class="fa-solid fa-calendar-day" aria-hidden="true"></i>
                    <span th:text="#{plantilla.dashboard}"></span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'citas'} ? 'active'" th:href="@{/cita/listado}">
                    <i class="fa-solid fa-clipboard-list" aria-hidden="true"></i>
                    <span th:text="#{plantilla.citas}"></span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'barberos'} ? 'active'" th:href="@{/barbero/listado}">
                    <i class="fa-solid fa-user" aria-hidden="true"></i>
                    <span th:text="#{plantilla.barberos}"></span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'clientes'} ? 'active'" th:href="@{/usuario/listado}">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <span th:text="#{plantilla.clientes}"></span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'horarios'} ? 'active'" th:href="@{/horario/listado}">
                    <i class="fa-solid fa-calendar-days" aria-hidden="true"></i>
                    <span th:text="#{plantilla.horarios}"></span></a>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:classappend="${opcion == 'servicios'} ? 'active'" th:href="@{/servicio/listado}">
                    <i class="fa-solid fa-scissors" aria-hidden="true"></i>
                    <span th:text="#{plantilla.servicios}"></span></a>
            </li>
            <li class="nav-item mt-4">
                <a class="nav-link" th:href="@{/}">
                    <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
                    <span th:text="#{plantilla.salir}"></span></a>
            </li>
        </ul>
    </aside>

    <!-- FOOTER -->
    <footer th:fragment="footer" class="p-2 mt-5 bg-dark text-white">
        <p class="small text-center mb-0"><span th:text="#{plantilla.derechos}"></span> &copy;</p>
    </footer>

    <!-- TOAST -->
    <section th:fragment="mostrarToast">
        <div aria-live="polite" aria-atomic="true"
             class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">
            <div th:if="${error}" class="toast show"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true"
                 data-bs-autohide="true">
                <div class="toast-header text-white bg-danger">
                    <i class="fa-solid fa-bomb" aria-hidden="true"></i>
                    <strong class="me-auto ms-1" th:text="#{error}"></strong>
                </div>
                <div class="toast-body">
                    <p th:text="${error}"></p>
                    <div class="mt-2 pt-2 border-top text-center">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast" th:text="#{accion.cerrar}"></button>
                    </div>
                </div>
            </div>
            <div th:if="${todoOk}" class="toast show"
                 role="status"
                 aria-live="polite"
                 aria-atomic="true"
                 data-bs-autohide="true">
                <div class="toast-header text-white bg-success">
                    <i class="fa-solid fa-square-check" aria-hidden="true"></i>
                    <strong class="me-auto ms-1" th:text="#{atencion}"></strong>
                </div>
                <div class="toast-body">
                    <p th:text="${todoOk}"></p>
                    <div class="mt-2 pt-2 border-top text-center">
                        <button type="button" class="btn btn-secondary btn-sm"
                                data-bs-dismiss="toast" th:text="#{accion.cerrar}"></button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- MODAL CONFIRMAR ELIMINAR -->
    <section th:fragment="confirmarEliminar(accionEliminar, nombreId)">
        <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form th:action="${accionEliminar}" method="post">
                        <input type="hidden" th:name="${nombreId}" id="modalId"/>
                        <div class="modal-header bg-warning text-white">
                            <h5 class="modal-title" id="modalLabel">
                                <i class="fa-solid fa-circle-radiation" aria-hidden="true"></i>
                                <span th:text="#{accion.confirmar}"></span>
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <p><span th:text="#{accion.confirmar.texto1}"></span><span id="modalDescripcion"></span>?</p>
                            <h6 th:text="#{accion.confirmar.texto2}"></h6>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-danger">
                                <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                <span th:text="#{accion.eliminar}"></span>
                            </button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                                <span th:text="#{accion.cerrar}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- BADGE DE ESTADO -->
    <th:block th:fragment="estadoBadge(nombre)">
        <span th:if="${nombre == 'Pendiente'}" class="badge text-bg-warning" th:text="${nombre}"></span>
        <span th:if="${nombre == 'Confirmada'}" class="badge text-bg-primary" th:text="${nombre}"></span>
        <span th:if="${nombre == 'Cancelada'}" class="badge text-bg-danger" th:text="${nombre}"></span>
        <span th:if="${nombre == 'Completada'}" class="badge text-bg-success" th:text="${nombre}"></span>
    </th:block>

    <!-- NOMBRE DEL DÍA -->
    <th:block th:fragment="nombreDia(dia)">
        <span th:if="${dia == 1}" th:text="#{dia.1}"></span>
        <span th:if="${dia == 2}" th:text="#{dia.2}"></span>
        <span th:if="${dia == 3}" th:text="#{dia.3}"></span>
        <span th:if="${dia == 4}" th:text="#{dia.4}"></span>
        <span th:if="${dia == 5}" th:text="#{dia.5}"></span>
        <span th:if="${dia == 6}" th:text="#{dia.6}"></span>
        <span th:if="${dia == 7}" th:text="#{dia.7}"></span>
    </th:block>

</body>
</html>
