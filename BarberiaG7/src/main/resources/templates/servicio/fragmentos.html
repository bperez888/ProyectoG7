<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Servicio</title>
</head>
<body>

    <!-- FORMULARIO (encabezado + modal) -->
    <section th:fragment="formulario">
        <div class="row py-4 mb-2 bg-light mx-0">
            <div class="col-md-6 px-4">
                <h3 class="mb-0" th:text="#{servicio.titulo}"></h3>
            </div>
            <div class="col-md-6 px-4 text-md-end">
                <button type="button"
                        class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#servicioModal"
                        data-modo="agregar"
                        th:data-titulo="#{servicio.agregar}">
                    <i class="fa-solid fa-plus" aria-hidden="true"></i>
                    <span th:text="#{servicio.agregar}"></span>
                </button>
            </div>
        </div>

        <div class="modal fade" id="servicioModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="servicioForm" method="post" th:action="@{/servicio/guardar}">
                        <div class="modal-header" id="servicioModalHeader">
                            <h5 class="modal-title" id="servicioModalTitulo"></h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="servicioId" name="idServicio"/>

                            <div class="mb-3">
                                <label for="servicioNombre" class="form-label" th:text="#{servicio.nombre}"></label>
                                <input type="text" id="servicioNombre" name="nombre" class="form-control"
                                       maxlength="50" required="required"/>
                            </div>

                            <div class="mb-3">
                                <label for="servicioDescripcion" class="form-label" th:text="#{servicio.descripcion}"></label>
                                <textarea id="servicioDescripcion" name="descripcion" rows="3" class="form-control"></textarea>
                            </div>

                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label for="servicioPrecio" class="form-label" th:text="#{servicio.precio}"></label>
                                    <input type="number" id="servicioPrecio" name="precio" min="0" step="0.01"
                                           class="form-control" required="required"/>
                                </div>
                                <div class="col-6 mb-3">
                                    <label for="servicioDuracion" class="form-label" th:text="#{servicio.duracion}"></label>
                                    <input type="number" id="servicioDuracion" name="duracionMinutos" min="1" step="1"
                                           class="form-control" required="required"/>
                                </div>
                            </div>

                            <div class="form-check">
                                <input type="checkbox" id="servicioActivo" name="activo" class="form-check-input"/>
                                <input type="hidden" name="_activo" value="on"/>
                                <label for="servicioActivo" class="form-check-label" th:text="#{servicio.activo}"></label>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                                <span th:text="#{accion.cerrar}"></span>
                            </button>
                            <button type="submit" class="btn btn-success">
                                <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                                <span th:text="#{accion.guardar}"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- LISTADO -->
    <section th:fragment="listado" class="p-3">
        <div class="row p-3">
            <div class="col-md-9">
                <div class="card p-2">
                    <div class="card-header"><h4 th:text="#{servicio.listado}"></h4></div>
                    <div class="card-body">
                        <div th:if="${servicios != null and !servicios.empty}" class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th th:text="#{servicio.nombre}"></th>
                                        <th th:text="#{servicio.descripcion}"></th>
                                        <th class="text-end" th:text="#{servicio.precio}"></th>
                                        <th class="text-center" th:text="#{servicio.duracion}"></th>
                                        <th th:text="#{servicio.activo}"></th>
                                        <th><span class="visually-hidden" th:text="#{cita.acciones}"></span></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="s : ${servicios}">
                                        <td th:text="${s.idServicio}"></td>
                                        <td th:text="${s.nombre}"></td>
                                        <td class="small text-muted" th:text="${s.descripcion}"></td>
                                        <td class="text-end" th:text="${#numbers.formatCurrency(s.precio)}"></td>
                                        <td class="text-center" th:text="${s.duracionMinutos}"></td>
                                        <td>
                                            <span class="badge"
                                                  th:classappend="${s.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                                                  th:text="${s.activo} ? #{estado.activo} : #{estado.inactivo}"></span>
                                        </td>
                                        <td class="text-nowrap">
                                            <button type="button" class="btn btn-danger btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                    th:data-bs-id="${s.idServicio}"
                                                    th:data-bs-descripcion="${s.nombre}">
                                                <i class="fa-solid fa-trash" aria-hidden="true"></i>
                                                <span th:text="#{accion.eliminar}"></span>
                                            </button>
                                            <button type="button" class="btn btn-warning btn-sm"
                                                    data-bs-toggle="modal" data-bs-target="#servicioModal"
                                                    data-modo="editar"
                                                    th:data-titulo="#{accion.actualizar}"
                                                    th:data-id="${s.idServicio}"
                                                    th:data-nombre="${s.nombre}"
                                                    th:data-descripcion="${s.descripcion}"
                                                    th:data-precio="${s.precio}"
                                                    th:data-duracion="${s.duracionMinutos}"
                                                    th:data-activo="${s.activo}">
                                                <i class="fas fa-pencil-alt" aria-hidden="true"></i>
                                                <span th:text="#{accion.actualizar}"></span>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="text-center p-2" th:if="${servicios == null or servicios.empty}">
                            <span th:text="#{lista.vacia}"></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card text-center bg-success text-white mb-3">
                    <div class="card-body">
                        <h3 th:text="#{servicio.total}"></h3>
                        <h4 class="fs-2">
                            <i class="fas fa-scissors" aria-hidden="true"></i>
                            <span th:text="${totalServicios}"></span>
                        </h4>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
