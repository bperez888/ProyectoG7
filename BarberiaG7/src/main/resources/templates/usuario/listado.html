<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"><title>Título</title></head>
    <body>
        <div class="d-flex">
            <aside th:replace="~{general/fragmentos :: sidebarAdmin('clientes')}"></aside>
            <main class="flex-grow-1">
                <div class="row py-4 mb-2 bg-light mx-0">
                    <div class="col px-4"><h3 class="mb-0">[[#{usuario.titulo}]]</h3></div>
                </div>
                <section class="p-3">
                    <div class="row p-3">
                        <div class="col-md-9">
                            <div class="card p-2">
                                <div class="card-body">
                                    <div th:if="${!clientes.empty}" class="table-responsive">
                                        <table class="table table-striped table-hover align-middle">
                                            <thead><tr>
                                                    <th>[[#{usuario.nombre}]]</th>
                                                    <th>[[#{usuario.telefono}]]</th>
                                                    <th>[[#{usuario.correo}]]</th>
                                                    <th>[[#{usuario.registro}]]</th>
                                                    <th>[[#{usuario.estado}]]</th>
                                                </tr></thead>
                                            <tbody>
                                                <tr th:each="u : ${clientes}">
                                                    <td><i class="fa-solid fa-circle-user fa-lg text-secondary me-1"></i> [[${u.nombre + ' ' + u.apellidos}]]</td>
                                                    <td>[[${u.telefono}]]</td>
                                                    <td>[[${u.correo}]]</td>
                                                    <td><span th:if="${u.fechaRegistro != null}" th:text="${u.fechaRegistro.toLocalDate()}"></span></td>
                                                    <td><span class="badge" th:classappend="${u.activo} ? 'text-bg-success' : 'text-bg-secondary'"
                                                              th:text="${u.activo} ? #{estado.activo} : #{estado.inactivo}"></span></td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="text-center p-2" th:if="${clientes.empty}">[[#{lista.vacia}]]</div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card text-center bg-success text-white mb-3">
                                <div class="card-body"><h3>[[#{usuario.total}]]</h3>
                                    <h4 class="fs-2"><i class="fas fa-users"></i> [[${totalClientes}]]</h4>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <footer th:replace="~{general/fragmentos :: footer}"></footer>
            </main>
        </div>
    </body>
</html>
