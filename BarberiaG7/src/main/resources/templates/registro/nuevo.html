<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"><title>Registro</title></head>
    <body class="bg-secondary-subtle">
        <main class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
            <div class="card shadow-sm" style="max-width: 460px; width: 100%;">
                <div class="card-body p-4">
                    <h3 class="text-center fw-bold mb-4">[[#{registro.titulo}]]</h3>
                    <form method="post" th:action="@{/registro/guardar}" class="was-validated">
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label for="nombre" class="form-label">[[#{registro.nombre}]]</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" maxlength="50" required="required"/>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label for="apellidos" class="form-label">[[#{registro.apellidos}]]</label>
                                <input type="text" id="apellidos" name="apellidos" class="form-control" maxlength="75" required="required"/>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">[[#{registro.correo}]]</label>
                            <input type="email" id="correo" name="correo" class="form-control" required="required"/>
                        </div>
                        <div class="mb-3">
                            <label for="telefono" class="form-label">[[#{registro.telefono}]]</label>
                            <input type="tel" id="telefono" name="telefono" class="form-control" maxlength="25"/>
                        </div>
                        <div class="mb-4">
                            <label for="contrasena" class="form-label">[[#{registro.contrasena}]]</label>
                            <input type="password" id="contrasena" name="contrasena" class="form-control" minlength="6" maxlength="50" required="required"/>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-light border border-dark px-4 fw-semibold">[[#{registro.boton}]]</button>
                        </div>
                    </form>
                    <p class="text-center small mt-3 mb-0">
                        <a th:href="@{/login}">[[#{registro.tieneCuenta}]]</a>
                    </p>
                </div>
            </div>
        </main>
        <section th:replace="~{general/fragmentos :: mostrarToast}"></section>
    </body>
</html>
